<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100">
  <rect width="800" height="1100" fill="#f7f4ef"/>
  <rect x="40" y="40" width="720" height="1020" fill="#fffef9" stroke="#d4cfc4" stroke-width="1"/>
  <text x="400" y="100" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#111" letter-spacing="2">III – DISPOSITIVO</text>
  <text x="80" y="150" font-family="Georgia, serif" font-size="13" fill="#333">Ante o exposto:</text>
  <text x="80" y="195" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="700">1. JULGO EXTINTO, SEM RESOLUÇÃO DO MÉRITO,</text>
  <text x="80" y="220" font-family="Georgia, serif" font-size="12" fill="#333">o pedido de restituição/repetição do indébito, diante da</text>
  <text x="80" y="242" font-family="Georgia, serif" font-size="12" fill="#333">satisfação superveniente da pretensão patrimonial</text>
  <text x="80" y="264" font-family="Georgia, serif" font-size="12" fill="#333">(art. 485, VI, do CPC);</text>
  <text x="80" y="310" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="700">2. JULGO PROCEDENTE o pedido de indenização</text>
  <text x="80" y="335" font-family="Georgia, serif" font-size="12" fill="#333">por danos morais e, em consequência,</text>
  <rect x="80" y="360" width="640" height="90" fill="#e8f5ef" stroke="#a8d5c0"/>
  <text x="100" y="395" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#0d5c3a">CONDENO a ré a pagar a quantia de</text>
  <text x="100" y="425" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#0d5c3a">R$ 3.000,00 (três mil reais)</text>
  <text x="80" y="490" font-family="Georgia, serif" font-size="12" fill="#333">a título de danos morais;</text>
  <text x="80" y="530" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="700">3.</text>
  <text x="105" y="530" font-family="Georgia, serif" font-size="12" fill="#333">Correção monetária a partir desta sentença; juros de mora</text>
  <text x="105" y="552" font-family="Georgia, serif" font-size="12" fill="#333">desde o evento danoso (arts. 389, 398 e 406 do CC);</text>
  <text x="80" y="595" font-family="Georgia, serif" font-size="13" fill="#222" font-weight="700">4. INDEFIRO</text>
  <text x="175" y="595" font-family="Georgia, serif" font-size="12" fill="#333">o pedido de expedição de ofício à Secretaria</text>
  <text x="80" y="617" font-family="Georgia, serif" font-size="12" fill="#333">de Prêmios e Apostas do Ministério da Fazenda.</text>
  <line x1="80" y1="660" x2="720" y2="660" stroke="#d4cfc4"/>
  <text x="80" y="700" font-family="Georgia, serif" font-size="12" fill="#555">Resolvo o mérito quanto ao pedido de indenização por</text>
  <text x="80" y="722" font-family="Georgia, serif" font-size="12" fill="#555">danos morais, na forma do art. 487, I, do CPC.</text>
  <text x="80" y="760" font-family="Georgia, serif" font-size="12" fill="#555">Sem condenação em custas e honorários nesta fase</text>
  <text x="80" y="782" font-family="Georgia, serif" font-size="12" fill="#555">(arts. 54 e 55 da Lei nº 9.099/95).</text>
  <text x="80" y="830" font-family="Georgia, serif" font-size="12" fill="#555">Publique-se. Registre-se. Intimem-se.</text>
  <text x="400" y="920" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#444">Teresina/PI, datado e assinado eletronicamente.</text>
  <text x="400" y="960" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#666">Juiz(a) de Direito da 4º Juizado Especial Cível</text>
  <text x="80" y="1020" font-family="Arial, sans-serif" font-size="10" fill="#999">Dados de identificação omitidos · ilustração fiel ao teor da decisão</text>
</svg>
